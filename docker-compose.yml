version: "3.8"

services:
  soli-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soli-proxy
    restart: unless-stopped
    network_mode: host
    ports:
      - "80:80"
      - "443:443"
      - "9090:9090"
    volumes:
      - ./config.toml:/etc/soli-proxy/config.toml:ro
      - ./certs:/etc/soli-proxy/certs
      - ./sites:/etc/soli-proxy/sites
      - ./run:/etc/soli-proxy/run
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SOLI_LOG_LEVEL=info
      - SOLI_PID_DIR=/etc/soli-proxy/run
      - SOLI_LOG_DIR=/etc/soli-proxy/run/logs
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: soli-redis
    restart: unless-stopped
    networks:
      - soli-apps
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  soli-apps:
    driver: bridge

volumes:
  redis-data:
    driver: local
