# Soli Proxy Configuration
# Server settings
[server]
bind = "0.0.0.0:80"   # HTTP listener; "[::]:80" listens on IPv6 and IPv4 (dual-stack)
https_port = 443      # HTTPS listener, on the same address as `bind`
worker_threads = "auto"
# On SIGTERM/SIGINT: stop accepting, then give in-flight requests up to this
# many seconds to finish (the wait ends with the last one). Default 10.
# shutdown_grace_period = 10

# TLS Configuration
[tls]
mode = "auto"  # "auto" for self-signed dev, "letsencrypt" for production
cache_dir = "./certs"
# HSTS (HTTP Strict-Transport-Security) is sent on every HTTPS response.
# max-age in seconds; default 63072000 (2 years). Set to 0 to disable.
# hsts_max_age_seconds = 63072000
# Set to false on shared parent domains where independent subdomains exist.
# hsts_include_subdomains = true
# Plaintext requests for hosts the proxy serves get a 308 to https://.
# force_https = true
# Lowest TLS version accepted: "1.2" (default) or "1.3". Session resumption
# (TLS 1.3 tickets, a 32k-entry TLS 1.2 session cache) is always enabled.
# min_version = "1.2"

# Let's Encrypt (for production)
[letsencrypt]
staging = false
email = "admin@example.com"
terms_agreed = true

# Logging Configuration (level/format/output/max_* are read at startup only)
[logging]
level = "info"     # trace|debug|info|warn|error, or a filter: "info,soli_proxy::server=debug"
format = "json"    # or "text"; the TUI's error screen needs json
output = "stdout"  # "stderr", or "file:/var/log/soli-proxy/proxy.log"
# File output rotates by size: proxy.log -> proxy.log.1 -> ... New files are 0640.
# max_size = "100MB"   # "0" disables rotation
# max_files = 5        # rotated files kept
# Body logging flags are reserved for future use and currently have no effect.
include_request_body = false
include_response_body = false
log_endpoints = true  # log one line per request (method, path, host, status, latency)

# Metrics Configuration
[metrics]
enabled = true
endpoint = "/metrics"

# Health Check Configuration
[health]
enabled = true
liveness_path = "/health/live"
readiness_path = "/health/ready"

# Limits Configuration
[limits]
max_connections = 10000      # concurrent client connections; extra ones wait up to 10 s for a slot
# Simultaneous connections per client address (IPv6: per /64), across HTTP and
# HTTPS. Excess connections are closed on accept. Default 256; 0 disables.
# max_connections_per_ip = 256
max_request_size = "10MB"    # request bodies above this get 413
keep_alive_timeout = 30      # HTTP/1 header read (bounds idle keep-alives); HTTP/2 idle timeout
request_timeout = 60         # seconds for the upstream exchange before a 504
# Forwarded WebSockets:
# websocket_idle_timeout_secs = 300            # close if both directions are silent this long
# websocket_max_lifetime_secs = 3600           # absolute cap per connection
# websocket_max_bytes_per_direction = 1073741824

# Rate Limiting Configuration (in-process token bucket; redis_url is unused)
[rate_limiting]
enabled = true
strategy = "token_bucket"
requests_per_second = 1000
burst_size = 2000

# Apps Configuration (defaults for deployed apps)
# Can be overridden per-app in app.infos
[apps]
# default_user = "rocky"
# default_group = "rocky"
# health_failure_threshold = 3   # consecutive failed health checks before failover
# port_range_start = 20000       # slot ports (the only range used when multi_tenant)
# port_range_end = 30000
# multi_tenant = true            # untrusted apps; see the README's Multi-Tenant section
# tenant_proxy_env = false       # forward HTTP(S)_PROXY into tenant containers
# tenant_proxy_env_credentials = false  # ...even when it carries user:password@
# Apps keep running when the proxy stops or restarts, and the next proxy adopts
# them (README: "Restarts and upgrades"). true = stop them with the proxy, as
# earlier versions did; it is the default under --dev. `soli-proxy stop --all`
# stops them on demand.
# stop_on_shutdown = false

# Circuit Breaker Configuration
# Tracks backend health and stops sending traffic to failing backends.
# When all targets for a route are open, returns 503 Service Unavailable.
[circuit_breaker]
failure_threshold = 5               # consecutive failures before opening breaker
recovery_timeout_secs = 30          # seconds before probing an open backend
success_threshold = 2               # successful probes to close breaker
failure_status_codes = [502, 503, 504]  # HTTP codes that count as failures

# Admin REST API Configuration
# Default binds to loopback only. Exposing on a non-loopback address
# requires `api_key` or `username`+`password_hash` — the proxy refuses
# to start the admin API otherwise. Without a credential, the API only
# answers requests whose Host is localhost / a loopback IP (DNS-rebinding
# guard). Failed logins are limited to 10 per client IP per minute (429).
# ADMIN_PASSWORD_HASH must be a bcrypt hash at cost 4..=13 (`hash-password`).
[admin]
enabled = true
bind = "127.0.0.1:9090"
# api_key = "your-secret-key"

# Lua Scripting Configuration
# When enabled, scripts are loaded from scripts_dir.
# Scripts can be assigned globally or per-route in proxy.conf
# (cors.lua, logging.lua and rate_limit.lua ship in scripts/lua/):
#   [global] @script:cors.lua,logging.lua
#   /api/* -> http://localhost:3000  @script:auth.lua,rate_limit.lua
# Built-in modules: log, base64, crypto, env, time, shared
[scripting]
enabled = false
scripts_dir = "./scripts/lua"
hook_timeout_ms = 10  # Max execution time per hook call in milliseconds
# Environment variables Lua's `env` module may read; everything else reads nil.
# exposed_env = ["API_BACKEND_TOKEN"]

# Authentication
# There is no [auth] section. HTTP Basic auth is set where it applies —
#   * per route in proxy.conf:      app.example.com -> http://... @auth:user:<bcrypt>
#   * per app in its app.infos:     [auth.users] user = "<bcrypt>"
#   * for the admin API:            [admin] api_key, or ADMIN_USER + ADMIN_PASSWORD_HASH
# Hashes come from `soli-proxy hash-password`.
#
# Forward authentication delegates the decision to an SSO service
# (oauth2-proxy, Authelia, Authentik, ...): before each request the proxy sends
# it a GET with the client's Cookie/Authorization and X-Forwarded-Method/-Uri/
# -Host/-Proto/-For. 2xx lets the request through (copying the named response
# headers upstream), anything else is relayed to the client (401, 302 to the
# login page...), no answer is a 503. Set per route or per app —
#   * proxy.conf:  app.example.com -> http://... @forward_auth:http://127.0.0.1:4180/ \
#                      @forward_auth_headers:X-Auth-Request-User,X-Auth-Request-Email
#   * app.infos:   [auth] forward = "http://127.0.0.1:4180/"
#                         forward_headers = ["X-Auth-Request-User"]
# JWT / API-key validation inside the proxy is not implemented: delegate it to
# such a service, or do it in a Lua on_request hook or in the backend.
[forward_auth]
# Seconds the auth service has to answer (connect, headers, body of a denial).
# Unset or 0 = 5. Applied on the next request after a reload.
timeout_secs = 5
# multi_tenant mode only: the auth URLs an app's `[auth] forward` may name —
# the proxy fetches that URL, so a tenant must not be able to point it at
# 169.254.169.254 or an internal admin port. An entry ending in "/" allows any
# path below it, otherwise exactly that path (query string not compared).
# Empty (the default): tenants cannot use forward-auth. Ignored otherwise.
# allowed_urls = ["http://127.0.0.1:4180/", "http://127.0.0.1:9091/api/authz/forward-auth"]
