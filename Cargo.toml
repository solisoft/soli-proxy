[package]
name = "soli-proxy"
version = "0.17.1"
edition = "2021"
description = "A fast, configurable reverse proxy with automatic HTTPS, Lua scripting, and blue-green deployments"
license = "MIT"
repository = "https://github.com/solisoft/soli-proxy"

[[bin]]
name = "httptest"
path = "src/bin/httptest.rs"

[[bin]]
name = "hash-password"
path = "src/bin/hash-password.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2"] }
http = "1.0"
http-body = "1.0"
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
rcgen = "0.12"
webpki-roots = "0.26"
regex = "1"
notify = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1.0"
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
portpicker = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
futures = "0.3"
scopeguard = "1.2"
hmac = { version = "0.12", optional = true }
url = { version = "2.5", features = ["serde"] }
arc-swap = "1.7"
tokio-tungstenite = "0.28"
futures-util = "0.3"
tower = { version = "0.5", features = ["full"] }
pem = "3"
x509-parser = "0.16"
instant-acme = "0.8"
rustls-pemfile = "2"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"], optional = true }
flate2 = "1.1.9"
bcrypt = "0.15"
async-stream = "0.3"
dotenv = "0.15.0"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.28", features = ["serde"] }
crossterm = { version = "0.28", features = ["serde"] }
rpassword = "7"

[features]
default = ["scripting"]
scripting = ["mlua", "hmac"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
portpicker = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "components"
harness = false

[[bench]]
name = "config_parsing"
harness = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
