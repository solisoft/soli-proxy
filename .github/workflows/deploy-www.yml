# Verify and deploy the documentation site (proxy.solisoft.net) on every push to
# main that touches www/.
#
# Server contract (soli-proxy — this repository's own binary, running in
# production and serving its own docs):
#   1. rsync www/ into <sites_dir>/<site_dir>/ — that folder and nothing else;
#   2. soli-proxy deploy: starts the idle slot, waits for it, moves traffic
#      across, then stops the old one.
#
# The site directory must already exist on the server with its own app.infos.
# This workflow creates nothing and touches no other folder.
#
# Modelled on ../lang/.github/workflows/deploy-www.yml, with three deliberate
# differences: this site has no db/ (so no migration step), it reads no .env
# (so none is required on the server), and `soli lint` is clean today, so it
# gates here rather than being advisory.
name: deploy www

on:
  push:
    branches: [main]
    # The site is www/. A Rust-only commit changes nothing it serves, and
    # redeploying for one would take the site through a blue-green switch for
    # no reason.
    paths:
      - 'www/**'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

# Two pushes close together must not interleave halfway through an rsync, and a
# deployment already running is never cancelled — that would leave the server
# with half a tree.
concurrency:
  group: deploy-www
  cancel-in-progress: false

env:
  # The version the server runs, verified below rather than hoped for. A CI that
  # checks the site against a different interpreter than production has not
  # checked production. Confirmed against the box on 2026-09-10 (`soli --version`
  # on 92.222.164.98 reported 2.0.6); ../lang pins the same. A developer machine
  # may well be ahead — mine was on 2.1.0 — which is exactly what the version
  # gate in the deploy job is there to catch.
  SOLI_VERSION: "2.0.6"

jobs:
  verify:
    name: the site builds and answers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5

      # Direct download of the pinned release: the published install.sh only
      # knows `latest`.
      - name: Install the pinned soli
        working-directory: .
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/solisoft/soli_lang/releases/download/v$SOLI_VERSION/soli-linux-amd64.tar.gz" \
            -o "$tmp/pkg.tar.gz"
          tar -xzf "$tmp/pkg.tar.gz" -C "$tmp"
          sudo install -m 0755 "$(find "$tmp" -type f -name soli -perm -u+x | head -1)" /usr/local/bin/soli
          rm -rf "$tmp"
          got="$(soli --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ "$got" = "$SOLI_VERSION" ] || { echo "soli $got installed, $SOLI_VERSION expected" >&2; exit 1; }
          echo "soli $got"

      # Tailwind is compiled by `soli serve --dev` on a developer machine and the
      # result is committed; production serves public/ as-is. An empty file here
      # means the site would go out unstyled.
      - name: The compiled CSS is committed
        run: test -s public/css/application.css

      # The real gate. It boots the site exactly as the server will and asks for
      # /up. Booting warms every handler, so a syntax error, a missing view or a
      # broken route registration fails here rather than in production.
      - name: The site boots and answers /up
        run: |
          set -euo pipefail
          soli serve . --port 19555 --workers 1 > /tmp/boot.log 2>&1 &
          pid=$!
          code=000
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:19555/up || echo 000)"
            [ "$code" = "200" ] && break
            kill -0 $pid 2>/dev/null || { echo "the server exited before answering" >&2; break; }
            sleep 1
          done
          kill -TERM $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "/up answered $code, not 200:" >&2
            tail -40 /tmp/boot.log >&2
            exit 1
          fi
          echo "/up -> 200"
          grep -E 'warmed [0-9]+ handlers' /tmp/boot.log || true

      # Every documented page, not just /up: this site *is* the documentation,
      # so a route that 500s is the failure that matters. The list mirrors
      # www/config/routes.sl; add a route there, add it here.
      - name: Every documented page answers 200
        run: |
          set -euo pipefail
          soli serve . --port 19557 --workers 1 > /tmp/pages.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:19557/up || echo 000)" = "200" ] && break
            kill -0 $pid 2>/dev/null || { echo "the server exited before answering" >&2; break; }
            sleep 1
          done
          rc=0
          for path in / /docs /docs/getting-started /docs/apps /docs/configuration \
                      /docs/dev-https /docs/admin-api /docs/scripting /docs/security \
                      /docs/deployment /docs/benchmark /changelog /health; do
            got="$(curl -s -o /dev/null -w '%{http_code}' -m 8 "http://127.0.0.1:19557$path" || echo 000)"
            echo "$got  $path"
            [ "$got" = "200" ] || rc=1
          done
          kill -TERM $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          if [ "$rc" != "0" ]; then
            echo "" >&2
            echo "At least one page did not answer 200." >&2
            tail -40 /tmp/pages.log >&2
            exit 1
          fi

      # A real gate: `soli lint` reports no issues on this site as of 2026-09.
      # If it ever starts failing, fix the code — do not demote this to
      # advisory, or it stops meaning anything.
      - name: Lint
        run: soli lint

      # Advisory, deliberately not blocking. As of 2026-09, `soli fmt --check`
      # reports ~158 diff lines on this site — a backlog that predates this
      # workflow. Blocking on it would mean the docs site could never be
      # deployed until someone clears it, so the diff is surfaced here instead
      # and can be promoted to a gate (drop `continue-on-error`) once it is
      # empty.
      - name: Formatting (advisory)
        continue-on-error: true
        run: soli fmt --check

  deploy:
    name: deploy the site
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: www
      url: https://${{ vars.DEPLOY_DOMAIN || 'proxy.solisoft.net' }}
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      # Only whether each key EXISTS is exposed here, never its value: a
      # secret interpolated into a plain env var is masked in the log but is
      # still handed to every step of the job.
      HAVE_KEY: ${{ secrets.SSH_DEPLOY_KEY != '' }}
      HAVE_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS != '' }}
      USER: ${{ vars.DEPLOY_USER || 'rocky' }}
      SITES_DIR: ${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}
      # Three separate identities. They happen to be the same string here, but
      # conflating them is how this silently fails elsewhere: DOMAIN is what the
      # site answers on, used for the HTTPS probe at the end; SITE_DIR is the
      # folder under sites/, what rsync targets and what the pid filter matches
      # on /proc/<pid>/cwd; APP is the `name` in app.infos, the identifier
      # soli-proxy deploy/restart take.
      DOMAIN: ${{ vars.DEPLOY_DOMAIN || 'proxy.solisoft.net' }}
      SITE_DIR: ${{ vars.DEPLOY_SITE_DIR || vars.DEPLOY_DOMAIN || 'proxy.solisoft.net' }}
      APP: ${{ vars.DEPLOY_APP || 'proxy.solisoft.net' }}
      # The pids of the processes serving THIS site. The server hosts a dozen,
      # so the filter is an `if` and not a `[ ... ] && echo`: a false `&&` at the
      # end of the loop makes the `for` exit 1, and under `set -e` that kills the
      # whole step — with the correct pid list already on stdout.
      PIDS: |
        for x in $(pgrep -x soli 2>/dev/null); do
          if [ "$(readlink /proc/$x/cwd 2>/dev/null)" = "${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}/${{ vars.DEPLOY_SITE_DIR || vars.DEPLOY_DOMAIN || 'proxy.solisoft.net' }}" ]; then
            echo $x
          fi
        done
      PROBE: |
        p=$(for x in $(pgrep -x soli 2>/dev/null); do
              if [ "$(readlink /proc/$x/cwd 2>/dev/null)" = "${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}/${{ vars.DEPLOY_SITE_DIR || vars.DEPLOY_DOMAIN || 'proxy.solisoft.net' }}" ]; then
                tr "\0" "\n" < /proc/$x/cmdline | grep -A1 -- "--port" | tail -1
              fi
            done | sort -u | tail -1)
        [ -n "$p" ] || { echo 000; exit 0; }
        curl -s -o /dev/null -w "%{http_code}" -m 5 "http://127.0.0.1:$p/up"
    steps:
      - uses: actions/checkout@v5

      # Nothing is configured on this repository yet, so the job reports what is
      # missing and stops rather than failing. Adding this workflow must not turn
      # main red; it starts deploying the day the secrets exist.
      - name: Is deployment configured?
        id: cfg
        run: |
          set -euo pipefail
          # All three secrets, not just the host. Checking DEPLOY_HOST alone
          # meant that setting it first — the natural order, since it is the one
          # you know off the top of your head — armed the job while it still had
          # no key to authenticate with, so the next push touching www/ failed
          # at the ssh step instead of reporting what was missing.
          missing=""
          [ -n "${HOST:-}" ] || missing="$missing DEPLOY_HOST"
          [ "${HAVE_KEY:-false}" = "true" ] || missing="$missing SSH_DEPLOY_KEY"
          [ "${HAVE_HOSTS:-false}" = "true" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Not deploying — still missing:$missing"
            echo ""
            echo "To turn this on, add to the repository:"
            echo "  secrets:   DEPLOY_HOST, SSH_DEPLOY_KEY, SSH_KNOWN_HOSTS"
            echo "  variables: DEPLOY_DOMAIN (default proxy.solisoft.net),"
            echo "             DEPLOY_USER (rocky), DEPLOY_SITES_DIR (/home/rocky/sites),"
            echo "             DEPLOY_APP (proxy.solisoft.net)"
            echo ""
            echo "The site directory must already exist on the server with its"
            echo "own app.infos; this workflow creates neither it nor that file."
            exit 0
          fi
          case "$DOMAIN" in *.*) ;; *) echo "DEPLOY_DOMAIN must contain a dot: $DOMAIN" >&2; exit 1 ;; esac
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Target: $USER@$HOST:$SITES_DIR/$SITE_DIR  (domain $DOMAIN, proxy app $APP)"

      - name: Prepare SSH
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # known_hosts rather than StrictHostKeyChecking=no: host verification
          # is not disabled on a channel that carries production code.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Only app.infos, unlike ../lang: this site reads no .env, so requiring
      # one would block the first deployment over a file nothing opens.
      - name: The site exists on the server
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "test -f '$SITES_DIR/$SITE_DIR/app.infos'" \
            || { echo "$SITES_DIR/$SITE_DIR must hold app.infos" >&2; exit 1; }

      # --delete-delay: what leaves the repository leaves the server. The
      # exclusions protect what belongs to the server — any secrets it grew
      # (.env) and the proxy's own files (app.infos, restart.txt) — plus
      # node_modules, which is a build input here and 200MB the server has no
      # use for.
      #
      # app.infos is tracked in this repository but still excluded: it carries
      # the port range and worker count the proxy is running with, and
      # overwriting a live proxy's configuration mid-deploy is the riskier
      # direction. Change it on the server when it needs to change.
      #
      # logs/ is written by the running app and has never been in the
      # repository, so --delete would wipe the site's own logs on every
      # deployment. config.toml, run/ and sites/ are root-owned artefacts a
      # proxy run can leave inside a site folder; they are excluded rather than
      # deleted, because an automated deploy is the wrong place to be reaping
      # root-owned files.
      - name: Sync the files
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          rsync -rlzv --delete-delay --delay-updates \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='app.infos' \
            --exclude='restart.txt' \
            --exclude='logs/' \
            --exclude='tmp/' \
            --exclude='config.toml' \
            --exclude='run/' \
            --exclude='sites/' \
            www/ "$USER@$HOST:$SITES_DIR/$SITE_DIR/"

      - name: The server runs the pinned version
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          installed="$(ssh "$USER@$HOST" 'soli --version' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "server: $installed — pinned: $SOLI_VERSION"
          if [ "$installed" != "$SOLI_VERSION" ]; then
            echo "" >&2
            echo "The server runs Soli $installed; this workflow verified $SOLI_VERSION." >&2
            echo "Align SOLI_VERSION here, or update the server." >&2
            exit 1
          fi

      # No `soli db:migrate up` step, unlike ../lang: this site has no db/
      # directory and opens no database. Add one here if that ever changes.

      # `soli-proxy deploy` rather than `touch restart.txt`: the command returns
      # an exit code and a reason. The trigger file is ignored in silence when
      # the proxy cannot start the slot — an orphaned process holding the port,
      # say — and the deployment looks green while the old code keeps serving.
      #
      # `-c` names proxy.conf, not config.toml — but what matters here is the
      # DIRECTORY it sits in: the loader reads `<that dir>/config.toml` for the
      # [admin] section, and that is what `deploy` needs in order to reach the
      # running daemon and let it move the slot. Pointing `-c` at config.toml
      # itself (as ../lang does) resolves the same directory and works for the
      # same reason; a missing file at that path is read as empty rather than
      # being an error, so neither spelling can fail loudly here.
      - name: Blue-green switch
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          before="$(ssh "$USER@$HOST" "$PIDS")"
          echo "processes before: ${before:-none}"
          echo "$before" > /tmp/pids-before
          if ! ssh "$USER@$HOST" "soli-proxy deploy -c '$SITES_DIR/config.toml' '$APP' 2>&1"; then
            echo "" >&2
            echo "The switch failed. Common cause: an orphaned slot still holds its port." >&2
            echo "  ssh $USER@$HOST 'soli-proxy logs -c $SITES_DIR/config.toml $APP'" >&2
            exit 1
          fi

      # The check is on a NEW process: a 200 from the old slot would only prove
      # the site answers, not that it answers with what was just pushed.
      - name: The new slot answers
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          before="$(cat /tmp/pids-before)"
          for i in $(seq 1 30); do
            sleep 3
            now="$(ssh "$USER@$HOST" "$PIDS")"
            fresh="$(comm -13 <(echo "$before" | sort) <(echo "$now" | sort) | tr -d ' ')"
            if [ -n "$fresh" ]; then
              code="$(ssh "$USER@$HOST" "$PROBE" 2>/dev/null | tail -1 || echo 000)"
              echo "attempt $i: new process $fresh, /up -> $code"
              [ "$code" = "200" ] && { echo "The new slot answers."; exit 0; }
            else
              echo "attempt $i: no new process yet"
            fi
          done
          echo "" >&2
          echo "No fresh slot answered 200 on /up within 90s." >&2
          echo "  ssh $USER@$HOST 'soli-proxy logs -c $SITES_DIR/config.toml $APP'" >&2
          exit 1

      # After a switch the proxy still spreads traffic over BOTH slot ports while
      # only one process runs, so one request in two hits a dead port and gets a
      # 421. `restart` brings both slots up on the current code.
      - name: Bring both slots up
        if: steps.cfg.outputs.configured == 'true'
        run: ssh "$USER@$HOST" "soli-proxy restart -c '$SITES_DIR/config.toml' '$APP'"

      # End to end, through the proxy, with the real hostname — where the 421
      # shows. The /up probe on the app's own port bypasses exactly the part
      # that fails.
      - name: The site answers through the proxy
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          want=12
          probe="for i in \$(seq 1 $want); do curl -sk -m 8 --resolve '$DOMAIN:443:127.0.0.1' -o /dev/null -w '%{http_code} ' 'https://$DOMAIN/up'; done"
          # Count the 200s, do not count the rest: the probe separates codes with
          # a space including after the last one, so `tr ' ' '\n'` yields one
          # extra empty line. Counted as "not 200" it made the check unfailable
          # in the wrong direction.
          for attempt in 1 2 3 4 5; do
            sleep 4
            codes="$(ssh "$USER@$HOST" "$probe" 2>/dev/null || true)"
            ok="$(printf '%s' "$codes" | tr ' ' '\n' | grep -c '^200$' || true)"
            echo "attempt $attempt: $codes(${ok:-0}/$want at 200)"
            [ "${ok:-0}" -eq "$want" ] && { echo "$want of $want requests at 200."; exit 0; }
          done
          echo "" >&2
          echo "The site did not answer $want/$want through the proxy." >&2
          exit 1
